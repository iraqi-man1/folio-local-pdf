<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9f5" />
    <meta name="description" content="Folio Local PDF Suite — private, offline PDF tools." />
    <title>Folio · Local PDF Suite</title>
    <script>
      try {
        const theme = localStorage.getItem('localpdf-theme') || 'light'
        const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.querySelector('meta[name="theme-color"]').content = dark ? '#111517' : '#f7f9f5'
      } catch { /* Storage can be unavailable in private browsing. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
